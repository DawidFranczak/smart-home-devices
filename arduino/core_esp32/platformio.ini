; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = littlefs
lib_deps = 
	bblanchon/ArduinoJson@^7.4.1
	heman/AsyncMqttClient-esphome@^2.1.0
	adafruit/Adafruit BusIO
	adafruit/Adafruit PWM Servo Driver Library@^3.0.2
	miguelbalboa/MFRC522@^1.4.12
	adafruit/Adafruit AHTX0@^2.0.5
lib_extra_dirs = 
	../lib/Mqtt
	../lib/Cpu
	../lib/ConfigManager
	../lib/Type
	../lib/EventEngine
	../lib/Peripheral
	../lib/PeripheralAht
    ../lib/PeripheralButtonBistable
    ../lib/PeripheralButtonMonostable
    ../lib/PeripheralManager
    ../lib/PeripheralPinInput
    ../lib/PeripheralPinOutput
    ../lib/PeripheralPirSensor
    ../lib/PeripheralRc522
    ../lib/PeripheralRelay
    ../lib/PeripheralRgbStrip
    ../lib/PeripheralRtc
    ../lib/PeripheralSequentialLight
	../lib/PeripheralManager
	../lib/PeripheralFactory
	../lib/SystemContext
	../lib/TimeManager
